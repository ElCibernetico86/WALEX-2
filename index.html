<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="logo.png" />

    <title>Walex Pro Finishes — Drywall Finishing &amp; Painting in North Dallas</title>
    <meta
      name="description"
      content="Tape, bed, texture and paint for North Dallas homes. One crew from bare drywall to the final coat — we move the furniture and handle the cleanup. Free estimates."
    />
    <link rel="canonical" href="https://walexprofinishes.com/" />
    <meta name="theme-color" content="#002366" />

    <!-- How the link looks when it's texted to a homeowner or shared on Facebook.
         Without these it renders as a bare blue URL — no title, no picture. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Walex Pro Finishes" />
    <meta property="og:url" content="https://walexprofinishes.com/" />
    <meta property="og:title" content="Walex Pro Finishes — Drywall Finishing &amp; Painting in North Dallas" />
    <meta
      property="og:description"
      content="Tape, bed, texture and paint for North Dallas homes. One crew from bare drywall to the final coat. Free estimates."
    />
    <meta property="og:image" content="https://walexprofinishes.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Exterior painting work by Walex Pro Finishes" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Walex Pro Finishes — Drywall Finishing &amp; Painting in North Dallas" />
    <meta
      name="twitter:description"
      content="Tape, bed, texture and paint for North Dallas homes. One crew from bare drywall to the final coat. Free estimates."
    />
    <meta name="twitter:image" content="https://walexprofinishes.com/og-image.jpg" />

    <!-- Local business markup. Google uses this for the business panel and map
         results. Deliberately omits aggregateRating, priceRange and opening
         hours until those are real — invented values here are exactly the kind
         of thing that gets a listing penalised. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "PaintingContractor",
        "name": "Walex Pro Finishes LLC",
        "url": "https://walexprofinishes.com/",
        "telephone": "+1-972-904-5132",
        "image": "https://walexprofinishes.com/og-image.jpg",
        "areaServed": [
          { "@type": "City", "name": "Dallas" },
          { "@type": "City", "name": "Plano" },
          { "@type": "City", "name": "Frisco" },
          { "@type": "City", "name": "McKinney" },
          { "@type": "City", "name": "Prosper" }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "TX",
          "addressCountry": "US"
        },
        "description": "Drywall taping, bedding, texture and interior/exterior painting for homes in North Dallas."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
